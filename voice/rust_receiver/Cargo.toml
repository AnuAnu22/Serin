[package]
name = "serin-voice-receiver"
version = "3.0.0"
edition = "2021"
description = "Voice receiver for Serin bot — connects to Discord voice via songbird Driver (no gateway)"

[[bin]]
name = "voice_receiver"
path = "src/main.rs"

[[bin]]
name = "minimal_test"
path = "src/minimal_test.rs"

[dependencies]
# Songbird: voice driver + receive ONLY (no serenity — avoids dual-gateway conflict)
# "gateway" feature here is just shared deps (dashmap, async-trait, etc) — NOT a gateway client
# "rustls" for TLS, "tungstenite" for websocket (voice UDP control channel)
songbird = { version = "0.6.0", default-features = false, features = ["driver", "receive", "rustls", "tungstenite", "gateway"] }
symphonia = { version = "0.5", features = ["wav", "pcm"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dashmap = "6.1.0"  # Used directly in Receiver for SSRC→user mapping
async-trait = "0.1"  # Required by songbird EventHandler trait
flume = "0.11"  # Channel between voice event handler and main loop

# PATCH: vendored songbird 0.6.0
#
# HISTORY CORRECTION (2026-08-05, verified against crates.io tarball +
# upstream git): the DAVE tail-offset bug (Opus InvalidPacket on every
# decode) was real in pre-release songbird — upstream fixed it in
# 653177e7 (2026-03-12) and released 0.6.0 already contains the fix.
# Our udp_rx "adjusted_tail" edit is semantically a no-op vs 0.6.0.
#
# The vendor tree is kept for ONE behavioral patch: ClientConnect SSRC
# mapping (ws.rs + events/core.rs + events/context/mod.rs). Upstream
# ignores ClientConnect as "discontinued", but Discord still sends it and
# the DAVE decrypt path silently drops packets from unmapped SSRCs.
# See docs/wiki/songbird-clientconnect-patch.md.
#
# Remove this vendor tree once ClientConnect handling lands upstream.
[patch.crates-io]
songbird = { path = "vendor/songbird" }

[profile.release]
opt-level = 2
lto = true
strip = true
