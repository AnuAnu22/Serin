name: test-suite

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: uv sync

      - name: Check THE_LAW structure rules
        run: uv run python scripts/law/check_structure.py

      - name: Check THE_LAW import rules
        run: uv run python scripts/law/check_imports.py

      - name: Run test suite
        run: uv run pytest tests/ -m "not integration" -q
        env:
          DISCORD_TOKEN: test

      - name: Run ruff linting
        run: uv run ruff check .

  voice-receiver:
    # The vendored songbird tree carries the ClientConnect SSRC patch — the ONE
    # behavioral patch (see docs/wiki/songbird-clientconnect-patch.md). Build
    # the crate in CI so a broken vendor tree (re-vendor, dep drift, bad merge)
    # fails loudly here instead of silently dropping user audio in production.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: voice/rust_receiver

      - name: Check voice receiver (vendored songbird + patch)
        run: cargo check --locked --manifest-path voice/rust_receiver/Cargo.toml --all-targets

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: uv sync

      - name: Security scan with bandit
        run: uv run bandit -r serin/ -ll

      - name: Verify no new secrets
        run: |
          if [ -f .secrets.baseline ]; then
            uv run detect-secrets scan --baseline .secrets.baseline . > /dev/null
          else
            echo "No baseline file found - skipping secret detection"
          fi

      - name: Dependency vulnerability scan
        run: uv run pip-audit
        continue-on-error: true

  graphify-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify graphify consistency
        run: |
          if [ -f graphify-out/graph.json ]; then
            echo "Knowledge graph exists - validation would go here"
            # Future: graphify validate command
          else
            echo "No knowledge graph to validate"
          fi
