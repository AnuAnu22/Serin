name: test-suite

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: uv sync

      - name: Check THE_LAW structure rules
        run: uv run python scripts/law/check_structure.py

      - name: Check THE_LAW import rules
        run: uv run python scripts/law/check_imports.py

      - name: Run test suite
        run: uv run pytest tests/ -m "not integration" -q
        env:
          DISCORD_TOKEN: test

      - name: Run ruff linting
        run: uv run ruff check .

      - name: Security scan with bandit
        run: uv run bandit -r serin/ -ll
        continue-on-error: true

      - name: Secret detection
        run: uv run detect-secrets scan --baseline .secrets.baseline
        continue-on-error: true

  graphify-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify graphify consistency
        run: |
          if [ -f graphify-out/graph.json ]; then
            echo "Knowledge graph exists - validation would go here"
            # Future: graphify validate command
          else
            echo "No knowledge graph to validate"
          fi
