[project]
name = "serin-ai"
version = "0.2.0"
description = "Advanced Discord AI bot with Qdrant memory system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Core dependencies
    "aiohttp>=3.13.2",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "pydantic>=2.0",
    "flask>=2.3.0",
    "flask-cors>=4.0.0",
    # Qdrant vector database
    "qdrant-client>=1.18.0",
    "docker>=7.1.0",  # Qdrant container auto-start (d4_2_connection_store)
    # Embedding models (CPU-only torch — the LLM runs in llama-swap externally)
    "sentence-transformers>=5.1.2",
    "torch>=2.9.1",
    # Discord
    "py-cord[voice]>=2.6.1",
    "audioop-lts>=0.2.0; python_version>='3.13'",  # audioop removed in 3.13
    # AI/ML
    "openai>=2.8.1",
    "vadersentiment>=3.3.2",
    # Utilities
    "python-dotenv>=1.0.0",
    "numpy>=1.24.0",
    "rank-bm25>=0.2.0",
    # Audio processing
    "faster-whisper>=1.2.1",
    # Dev tools (lightweight)
    "pillow>=12.0.0",
    "einops>=0.8.1",
    "edge-tts>=7.2.8",
    "websockets>=15.0.1",
    "pytest-asyncio>=1.3.0",
    "nltk>=3.10.0",
]

[project.optional-dependencies]
voice = [
    "coqui-tts>=0.27.0",
]
memory = [
    "chromadb>=1.3.5",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "watchfiles>=1.0.0",
    "maturin>=1.10.0",        # Build serin_core PyO3 module
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[project.scripts]
dev = "dev:main"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "N", "UP", "YTT"]
ignore = ["E501"]
fixable = ["I", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
warn_unused_ignores = false
follow_imports = "silent"
exclude = [
    "tests/",
    "build/",
    "dist/",
]

[tool.importlinter]
root_packages = ["serin"]

[[tool.importlinter.contracts]]
name = "Layer boundaries"
type = "layers"
layers = [
    "serin.d1_5_ops_tooling",
    "serin.d1_2_gateway_io",
    "serin.d1_1_pipeline_flow",
    "serin.d1_3_state_core",
    "serin.d1_4_config_base",
]
ignore_imports = [
    "serin.d1_2_gateway_io.d2_1_io_discord.d3_2_discord_bot -> serin.d1_5_ops_tooling.d2_2_tooling_background.d5_1_tooling_background",
    "serin.d1_2_gateway_io.d2_1_io_discord.d3_2_discord_bot -> serin.d1_5_ops_tooling.d2_4_passive_monitor",
    "serin.d1_2_gateway_io.d2_1_io_discord.d3_2_discord_bot -> serin.d1_5_ops_tooling.d2_5_voice_manager",
    "serin.d1_2_gateway_io.d2_1_io_discord.d3_1_pipeline_init -> serin.d1_5_ops_tooling.d2_1_control_panel.d3_2_panel_server",
    "serin.d1_2_gateway_io.d2_1_io_discord.d3_1_pipeline_init.d4_1_pipeline_initializer -> serin.d1_5_ops_tooling.d2_5_voice_manager",
    "serin.d1_2_gateway_io.d2_1_io_discord.d3_1_pipeline_init.d4_1_pipeline_initializer -> serin.d1_5_ops_tooling.d2_2_tooling_background.d5_1_tooling_background",
    "serin.d1_2_gateway_io.d2_1_io_discord.d3_1_pipeline_init.d4_1_pipeline_initializer -> serin.d1_5_ops_tooling.d2_4_passive_monitor",
    "serin.d1_2_gateway_io.d2_1_io_discord.d3_1_pipeline_init.d4_1_pipeline_initializer -> serin.d1_5_ops_tooling.d2_1_control_panel.d3_3_panel_lifecycle",
    # Panel observability: pipeline modules push live status / debug info to the
    # control-panel websocket and debug routes — a core -> ops link kept out of
    # the strict layer direction on purpose.
    "serin.d1_1_pipeline_flow.d2_1_flow_act.d3_1_act_runners.d4_2_runners_pipeline -> serin.d1_5_ops_tooling.d2_1_control_panel.d3_2_panel_server.d4_8_server.d5_2_server_websocket",
    "serin.d1_1_pipeline_flow.d2_1_flow_act.d3_2_act_stages.d4_1_decision_temporal -> serin.d1_5_ops_tooling.d2_1_control_panel.d3_2_panel_server.d4_8_server.d5_2_server_websocket",
    "serin.d1_1_pipeline_flow.d2_1_flow_act.d3_1_act_runners.d4_3_prompt_assembly.d5_1_prompt_assembly -> serin.d1_5_ops_tooling.d2_1_control_panel.d3_2_panel_server.d4_6_routes.d5_3_debug_routes.d6_2_debug_routes",
    "serin.d1_1_pipeline_flow.d2_1_flow_act.d3_1_act_runners.d4_1_runners_dispatch.d5_1_llm_call -> serin.d1_5_ops_tooling.d2_1_control_panel.d3_2_panel_server.d4_6_routes.d5_3_debug_routes.d6_2_debug_routes",
    # Affect persistence: the affect engine stores observations through the
    # memory-storage layer (introduced by the affect + selectivity rework).
    "serin.d1_3_state_core.d2_5_state_conversation.d3_3_affect_engine -> serin.d1_1_pipeline_flow.d2_4_flow_remember.d3_1_remember_core.d4_1_core_storage.d5_2_sqlite_store",
]

[tool.wily]
cache = ".wily"

# Use CPU-only PyTorch — the LLM runs in llama-swap, not in this process.
# Saves ~3GB of CUDA downloads.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "pytest-asyncio>=0.25",
    "detect-secrets>=1.5.0",  # pre-commit secrets gate (scripts/hooks/pre-commit.sh)
    "bandit>=1.8.0",          # pre-commit security gate
    "semgrep>=1.100.0",       # pre-commit pattern gate
    "ruff>=0.14.0",           # pre-commit lint gate
    "cosmic-ray>=8.7.0",
]
